services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Только localhost: база не видна из сети
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  checker:
    build: ./checker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: ./web
    restart: unless-stopped
    # Все переменные из .env (нужны AUTH_SECRET и ADMIN_* для npm run seed:admin),
    # но адрес базы внутри compose другой - хост db
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Auth.js в режиме production требует явно разрешить адрес сайта
      AUTH_TRUST_HOST: "true"
      MEDIA_DIR: /data/media
    volumes:
      # Картинки задач хранятся на нашем сервере
      - media-data:/data/media
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      checker:
        condition: service_started

volumes:
  db-data:
  media-data:
